<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Dark Calculator</title>
  <!-- Google Font for sleek modern numbers -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-card">
    <div class="calculator-header">
      <span class="brand">CALC</span>
      <span class="status-dot"></span>
    </div>

    <!-- Display Area -->
    <div class="display-container">
      <div id="previous-operand" class="previous-operand"></div>
      <input type="text" id="display" class="current-operand" readonly placeholder="0">
    </div>

    <!-- Keypad -->
    <div class="buttons">
      <button class="btn btn-action" onclick="clearDisplay()">AC</button>
      <button class="btn btn-action" onclick="deleteLast()">DEL</button>
      <button class="btn btn-operator" onclick="appendValue('/')">&divide;</button>
      <button class="btn btn-operator" onclick="appendValue('*')">&times;</button>

      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>
      <button class="btn" onclick="appendValue('9')">9</button>
      <button class="btn btn-operator" onclick="appendValue('-')">&minus;</button>

      <button class="btn" onclick="appendValue('4')">4</button>
      <button class="btn" onclick="appendValue('5')">5</button>
      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn btn-operator" onclick="appendValue('+')">+</button>

      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>
      <button class="btn" onclick="appendValue('3')">3</button>
      <button class="btn btn-equal" onclick="calculate()">=</button>

      <button class="btn btn-zero" onclick="appendValue('0')">0</button>
      <button class="btn" onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
